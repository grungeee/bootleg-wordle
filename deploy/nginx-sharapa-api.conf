# Reverse proxy for the SHARAPA API on plain HTTP (:80).
# deploy/setup-server.sh substitutes @DOMAIN@ and then lets
# `certbot --nginx -d @DOMAIN@ --redirect` add the TLS server block,
# so this file must not reference certificate paths that may not exist yet.

limit_req_zone $binary_remote_addr zone=sharapa_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=sharapa_api:10m rate=240r/m;

upstream sharapa_api {
    server 127.0.0.1:8760;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    client_max_body_size 16k;
    charset utf-8;

    # never trust a client-supplied forwarded chain
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /api/v1/healthz {
        proxy_pass http://sharapa_api;
        access_log off;
    }

    location ~ ^/api/v1/(register|login|account/) {
        limit_req zone=sharapa_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://sharapa_api;
    }

    location / {
        limit_req zone=sharapa_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://sharapa_api;
    }

    access_log /var/log/nginx/sharapa-api.access.log;
    error_log  /var/log/nginx/sharapa-api.error.log warn;
}
